name: Deploy Docs to Vercel

# Vercel builds and hosts the docs (root directory = docs/). This workflow just
# pings a Vercel Deploy Hook to trigger a production deployment. Use cases:
#   - a published GitHub Release      → ship docs alongside a release
#   - manual run (workflow_dispatch)  → on-demand redeploy
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
